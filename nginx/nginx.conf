server {
    listen 80;
    server_name mama-daj.ru www.mama-daj.ru;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://mama-daj.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.mama-daj.ru;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/mama-daj.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mama-daj.ru/privkey.pem;
    
    # Redirect www to non-www
    return 301 https://mama-daj.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mama-daj.ru;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/mama-daj.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mama-daj.ru/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    
    # Client max body size (for WordPress uploads)
    client_max_body_size 64M;
    
    # Proxy settings
    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Proxy timeouts (in seconds)
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
        send_timeout 60;
    }
}
