server {
    listen 80;
    server_name mama-daj.ru www.mama-daj.ru;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://mama-daj.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.mama-daj.ru;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/mama-daj.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mama-daj.ru/privkey.pem;
    
    # Redirect www to non-www
    return 301 https://mama-daj.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mama-daj.ru;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/mama-daj.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mama-daj.ru/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Client max body size (for WordPress uploads)
    client_max_body_size 64M;
    
    # Proxy settings
    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Proxy timeouts
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }
}
