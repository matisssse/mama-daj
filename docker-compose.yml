services:
  db:
    image: mysql:8.0
    container_name: mama-daj-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 30s

  wordpress:
    depends_on:
      db:
        condition: service_healthy
    image: wordpress:latest
    container_name: mama-daj-wordpress
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - wordpress-network

  ollama:
    image: ollama/ollama:latest
    container_name: mama-daj-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - wordpress-network
    # Раскомментируйте для GPU поддержки (требуется nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  article-service:
    build:
      context: ./article-service
      dockerfile: Dockerfile
    container_name: mama-daj-article-service
    restart: always
    depends_on:
      - wordpress
      - ollama
    environment:
      # Ollama настройки для локальной LLM
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      
      # WordPress настройки
      WORDPRESS_URL: ${WORDPRESS_URL:-http://wordpress}
      WORDPRESS_USER: ${WORDPRESS_API_USER}
      WORDPRESS_PASSWORD: ${WORDPRESS_API_PASSWORD}
      WORDPRESS_POST_STATUS: ${WORDPRESS_POST_STATUS:-draft}
      WORDPRESS_DEFAULT_CATEGORY: ${WORDPRESS_DEFAULT_CATEGORY:-1}
      
      # Настройки расписания
      SCHEDULE_TIME: ${SCHEDULE_TIME:-03:00}
      RUN_ON_STARTUP: ${RUN_ON_STARTUP:-false}
      PUBLISH_DELAY_SECONDS: ${PUBLISH_DELAY_SECONDS:-300}
      
      # Дополнительные настройки
      SITES_CONFIG_FILE: /app/config/sites.json
      ADD_SOURCE_LINK: ${ADD_SOURCE_LINK:-false}
    volumes:
      - ./article-service/config:/app/config:ro
      - article_service_data:/app/data
    networks:
      - wordpress-network

volumes:
  db_data:
    driver: local
  wordpress_data:
    driver: local
  article_service_data:
    driver: local
  ollama_data:
    driver: local

networks:
  wordpress-network:
    driver: bridge
